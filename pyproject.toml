[project]
name = "bronto-sdk"
version = "0.1.1"
description = "Python SDK for the Bronto observability platform"
readme = "README.md"
authors = [{ name = "Bronto", email = "support@bronto.io" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["bronto", "observability", "logs", "monitoring", "sdk"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "typing_extensions>=4.7",
]

[project.optional-dependencies]
mcp = ["mcp>=1.24,<2", "langchain-mcp-adapters>=0.3.1"]
langchain = ["langchain-core>=0.3"]

[project.urls]
homepage = "https://github.com/bronto-community/bronto-sdk-python"
source = "https://github.com/bronto-community/bronto-sdk-python"
issues = "https://github.com/bronto-community/bronto-sdk-python/issues"
changelog = "https://github.com/bronto-community/bronto-sdk-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "ruff>=0.16",
  "pyright>=1.1.414",
  "pytest>=9",
  "pytest-mock>=3.15",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7",
  "build>=1.6",
  "twine>=7",
  # Parses the workflow files in tests/unit/test_required_checks.py. Dev-only
  # on purpose: nothing the SDK ships reads YAML, and PyYAML has no py.typed,
  # so an import outside tests/ would fail pyright's strict mode.
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bronto_sdk"]

[tool.hatch.build.targets.sdist]
# Hatchling's default sdist is "every file git does not ignore", which makes the
# contents a byproduct rather than a decision — under it the 0.1.0 sdist shipped
# an internal planning document, .vscode/ and the whole .github/ tree. Since the
# sdist is attached to every GitHub Release, that default publishes whatever
# happens to be lying in the working tree. This list is the decision.
#
# api/ is deliberately included even though openapi.yaml is most of the archive:
# `just check-spec` is part of the contract, and it has nothing to verify
# against without the spec.
include = [
  "/src",
  "/tests",
  "/examples",
  "/api",
  "/scripts",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/SECURITY.md",
  "/LICENSE",
  "/VERSION",
  "/justfile",
  "/pyproject.toml",
  "/uv.lock",
  "/.python-version",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
# Inferred from requires-python, but stated explicitly so the UP (pyupgrade)
# rules have an unambiguous floor to rewrite toward.
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort — import order is never a review topic
  "UP",      # pyupgrade — keeps 3.11+ idioms honest
  "B",       # flake8-bugbear
  "D",       # pydocstyle — every public symbol documented
  "RUF",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstrings are enforced for the public API surface, not test bodies.
"tests/**" = ["D"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "examples"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", ".venv", "build", "dist"]
typeCheckingMode = "strict"
# The floor the SDK promises, deliberately NOT the .venv version (3.14). Pinned
# to the floor so 3.12+-only syntax cannot pass locally and break the oldest CI leg.
pythonVersion = "3.11"
reportPrivateUsage = true
reportUnnecessaryTypeIgnoreComment = true

[[tool.pyright.executionEnvironments]]
root = "tests"
# Tests import shared fixtures via `from tests.conftest import ...`, which
# pytest resolves from the repo root. Put the root on pyright's path too so it
# resolves the same import.
extraPaths = ["."]
reportMissingParameterType = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeStubs = "none"
reportPrivateUsage = "none"
reportUntypedFunctionDecorator = "none"

[[tool.pyright.executionEnvironments]]
root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=bronto_sdk --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/bronto_sdk"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]
# A floor, not a target. The suite sits at 100% across all 817 statements and
# 132 branches, and the intent is to keep it there — 90 is the point at which
# something has gone badly wrong, not the standard being aimed at.
#
# Set deliberately below where the suite actually is, so that a genuinely
# hard-to-test branch can land without holding up a pull request. The cost is
# that coverage could decay by roughly eighty statements before this fires, so
# read the per-file table in CI rather than trusting a green gate to mean
# nothing slipped.
fail_under = 90
